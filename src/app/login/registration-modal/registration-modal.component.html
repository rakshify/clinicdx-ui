<ion-header>
  <ion-toolbar>
    <ion-title>Registration</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="registration-container">
    <ion-card>
      <ion-card-content>
        <form [formGroup]="registrationForm">
          <div *ngIf="currentTab === 1">
            <ion-item>
              <ion-label position="floating">First Name</ion-label>
              <ion-input formControlName="fname" type="text"></ion-input>
            </ion-item>
            <ion-item>
              <ion-label position="floating">Last Name</ion-label>
              <ion-input formControlName="lname" type="text"></ion-input>
            </ion-item>
            <ion-item>
              <ion-label>Gender</ion-label>
              <ion-select formControlName="gender">
                <ion-select-option value="male">Male</ion-select-option>
                <ion-select-option value="female">Female</ion-select-option>
              </ion-select>
            </ion-item>
            <ion-item>
              <ion-label position="floating">Phone Number</ion-label>
              <ion-input formControlName="phone_number" type="tel"></ion-input>
            </ion-item>
            <ion-item>
              <ion-label position="floating">Email</ion-label>
              <ion-input formControlName="email" type="email"></ion-input>
            </ion-item>
          </div>

          <div *ngIf="currentTab === 2">
            <ion-item>
              <ion-label position="floating">Username</ion-label>
              <ion-input formControlName="username" type="text"></ion-input>
              <ion-icon name="checkmark-circle" color="success" slot="end" *ngIf="usernameAvailable === true"></ion-icon>
              <ion-icon name="close-circle" color="danger" slot="end" *ngIf="usernameAvailable === false"></ion-icon>
            </ion-item>
            <ion-text color="danger" *ngIf="usernameAvailable === false">
              {{ usernameMessage }}
            </ion-text>
            <ion-item>
              <ion-label position="floating">Password</ion-label>
              <ion-input formControlName="password" type="password"></ion-input>
            </ion-item>
            <ion-item>
              <ion-label position="floating">Confirm Password</ion-label>
              <ion-input formControlName="confirm_password" type="password"></ion-input>
            </ion-item>
          </div>
        </form>
        <div class="button-container">
          <div class="left-button">
            <ion-button *ngIf="currentTab === 2" (click)="previousTab()">
              <ion-icon name="arrow-back-outline"></ion-icon>
            </ion-button>
          </div>
          <div class="right-button">
            <ion-button *ngIf="currentTab === 1" (click)="nextTab()" [disabled]="!registrationForm.get('fname')?.valid || !registrationForm.get('lname')?.valid || !registrationForm.get('gender')?.valid || !registrationForm.get('phone_number')?.valid || !registrationForm.get('email')?.valid">
              <ion-icon name="arrow-forward-outline"></ion-icon>
            </ion-button>
            <ion-button *ngIf="currentTab === 2" (click)="submitRegistration()" [disabled]="!registrationForm.valid">
              Submit
            </ion-button>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
