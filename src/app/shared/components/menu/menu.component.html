<ion-menu side="start" menuId="main-menu" contentId="main">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <div *ngIf="isLoggedIn" class="user-info">
      <ion-avatar>
        <img [src]="userAvatarUrl" alt="User Avatar">
      </ion-avatar>
      <p>Hi, {{userName}}</p>
    </div>
    <ion-list>
      <ion-item *ngIf="!isLoggedIn" (click)="login()">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        <ion-label>Login</ion-label>
      </ion-item>
      <ion-item *ngIf="isLoggedIn" (click)="navigateTo('home')">
        <ion-icon name="home-outline" slot="start"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-item>
      <ion-item *ngIf="isLoggedIn" (click)="navigateTo('user-profile')">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-item>
      <ion-item *ngIf="isLoggedIn" (click)="navigateTo('book-appointment')">
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        <ion-label>Book Appointment</ion-label>
      </ion-item>
      <ion-item *ngIf="isDoctor" (click)="navigateTo('doctor-profile')">
        <ion-icon name="medkit-outline" slot="start"></ion-icon>
        <ion-label>Appointments</ion-label>
      </ion-item>
      <ion-item *ngIf="isDoctor" (click)="navigateTo('doctor-patients')">
        <ion-icon name="people-outline" slot="start"></ion-icon>
        <ion-label>Patient Records</ion-label>
      </ion-item>
      <ion-item *ngIf="isAdmin" (click)="navigateTo('admin')">
        <ion-icon name="settings-outline" slot="start"></ion-icon>
        <ion-label>Admin</ion-label>
      </ion-item>
      <ion-item *ngIf="isPharmacist" (click)="navigateTo('inventory')">
        <ion-icon name="medical-outline" slot="start"></ion-icon>
        <ion-label>Inventory</ion-label>
      </ion-item>
      <ion-item *ngIf="isLabTech" (click)="navigateTo('lab-reports')">
        <ion-icon name="document-text-outline" slot="start"></ion-icon>
        <ion-label>Reports</ion-label>
      </ion-item>
      <ion-item *ngIf="isLoggedIn" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
