<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>My Patients</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <app-patient *ngFor="let patient of patients" [patient]="patient"></app-patient>
  </ion-list>
  <ion-infinite-scroll (ionInfinite)="loadPatients($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more patients...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
